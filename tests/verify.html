<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>PhotoDrop 转换验收</title>
<style>body{font:16px/1.7 system-ui;max-width:850px;margin:40px auto;padding:20px}button{padding:12px 25px}pre{white-space:pre-wrap}</style>
<h1>PhotoDrop 图片转换验收</h1><p>使用 libheif 官方 HEIC 样本、Canvas 生成图片及损坏样本。</p>
<select id="photo-format"><option value="jpeg">JPEG</option><option value="png">PNG</option></select>
<button id="run">运行验收</button><p id="photo-status"></p><pre id="result"></pre>
<script src="/scripts/photo-converter.js"></script>
<script>
document.getElementById('run').onclick = async () => {
 const result=document.getElementById('result'); result.textContent='';
 const assert=(ok,label)=>{if(!ok)throw Error(label);result.textContent+='PASS '+label+'\n';};
 try {
  const raw=await fetch('example.heic').then(r=>{if(!r.ok)throw Error('HEIC fixture missing');return r.blob()});
  const source=new File([raw],'iphone.HEIC',{type:''});
  assert(await PhotoConverter.isHeic(source),'HEIC 无 MIME 识别');
  for(const fmt of ['jpeg','png']) {
   const file=await PhotoConverter.convert(source,fmt);
   const bytes=new Uint8Array(await file.slice(0,8).arrayBuffer());
   assert(fmt==='jpeg'?bytes[0]===255&&bytes[1]===216:bytes[0]===137&&bytes[1]===80, 'HEIC → '+fmt+' 文件头');
   assert(file.name==='iphone.'+(fmt==='jpeg'?'jpg':'png')&&file.type==='image/'+fmt, 'HEIC → '+fmt+' MIME 和后缀');
   const image=await createImageBitmap(file);assert(image.width>0&&image.height>0,fmt+' 可重新解码 '+image.width+'×'+image.height);image.close();
  }
  const canvas=document.createElement('canvas');canvas.width=4;canvas.height=3;
  const blob=await new Promise(r=>canvas.toBlob(r));
  const png=new File([blob],'transparent.png',{type:'image/png'});
  assert(await PhotoConverter.convert(png,'png')===png,'相同格式不重编码');
  const big=document.createElement('canvas');big.width=3000;big.height=2400;
  const bigBlob=await new Promise(r=>big.toBlob(r,'image/jpeg',0.99));
  const bigFile=new File([bigBlob],'large.jpg',{type:'image/jpeg'});
  const compressed=await PhotoConverter.convert(bigFile,'jpeg',false);
  const compressedImage=await createImageBitmap(compressed);
  assert(compressedImage.width===2048&&compressedImage.height===1638,'默认压缩最长边 2048 且保持比例');compressedImage.close();
  assert(compressed.size<bigFile.size,'默认 JPEG 压缩减少体积');
  const original=await PhotoConverter.convert(bigFile,'jpeg',true);
  assert(original===bigFile,'原图 JPEG 保留源文件字节');
  const jpeg=await PhotoConverter.convert(png,'jpeg');
  const bitmap=await createImageBitmap(jpeg);const ctx=canvas.getContext('2d');ctx.drawImage(bitmap,0,0);bitmap.close();
  const pixel=ctx.getImageData(0,0,1,1).data;assert(pixel[0]>245&&pixel[1]>245&&pixel[2]>245,'透明 PNG 转 JPEG 使用白底');
  const text=new File(['hello'],'note.txt',{type:'text/plain'});assert(await PhotoConverter.convert(text)===text,'非图片文件保持原样');
  let active=0, peak=0;
  const listener=e=>{if(e.detail.state==='processing')peak=Math.max(peak,++active);else if(['ready','error'].includes(e.detail.state))active--;};
  window.addEventListener('photo-item',listener);
  const batch=await PhotoConverter.prepare([png,bigFile,png]);
  window.removeEventListener('photo-item',listener);
  assert(batch.length===3&&batch[0].name==='transparent.jpg'&&batch[1].name==='large.jpg','多图并发处理保留选择顺序');
  assert(peak===2&&active===0,'并发上限 2 且所有任务收敛');
  const wrong=new File(['invalid'],'broken.heic',{type:'image/heic'});
  let failed=false;try{await PhotoConverter.prepare([wrong])}catch{failed=true}
  assert(failed,'损坏 HEIC 阻止整批发送');assert(!document.getElementById('photo-format').disabled,'失败后恢复格式选择');
  result.textContent+='ALL PASSED\n';
 } catch(e) {result.textContent+='FAIL '+e.stack;}
};
</script></html>
