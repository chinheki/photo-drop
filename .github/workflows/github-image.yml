name: PhotoDrop Check and Publish
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photodrop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/check.mjs
      - name: Verify server
        shell: bash
        run: |
          PORT=19091 WS_FALLBACK=true node server/index.js > /tmp/photodrop.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:19091/config; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:19091/ | grep -q 'sender-panel'
          curl --fail --silent http://127.0.0.1:19091/phone-links | grep -q 'urls'
  publish:
    needs: check
    if: github.event_name != 'pull_request' && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke test image
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build --pull --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" --label "org.opencontainers.image.revision=$COMMIT" -t "$IMAGE:sha-$COMMIT" .
          docker run -d --name photodrop-smoke -p 19091:3000 "$IMAGE:sha-$COMMIT"
          trap 'docker rm -f photodrop-smoke' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:19091/config; then exit 0; fi
            sleep 1
          done
          docker logs photodrop-smoke
          exit 1
      - name: Publish container
        id: registry
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          COMMIT: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          docker push "$IMAGE:sha-$COMMIT"
          if [ "$REF_TYPE" = tag ]; then TAG="$REF_NAME"; else TAG=latest; fi
          docker tag "$IMAGE:sha-$COMMIT" "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
          echo "Published: $IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Export runnable image
        env:
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          docker tag "$IMAGE:sha-$COMMIT" photodrop:latest
          docker save photodrop:latest | gzip > photodrop-image.tar.gz
          echo 'Download photodrop-image, extract the ZIP, then run: docker load -i photodrop-image.tar.gz' >> "$GITHUB_STEP_SUMMARY"
          echo 'Start: docker run -d --name photodrop -p 19091:3000 photodrop:latest' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish downloadable image
        uses: actions/upload-artifact@v4
        with:
          name: photodrop-image
          path: photodrop-image.tar.gz
          retention-days: 30
          compression-level: 0
      - name: Report registry restriction
        if: steps.registry.outcome == 'failure'
        run: echo '::warning::GHCR refused the push. The runnable Docker image is available in the photodrop-image artifact.'
